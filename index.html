<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Jigsaw</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background-color: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;
            color: #1F4E78;
            margin-bottom: 10px;
            font-size: 2.5em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        
        
        .instructions {
            text-align: center;
            margin-bottom: 20px;
            color: #666;
            font-size: 1.1em;
        }
        
        .controls {
            text-align: center;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        button {
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:nth-of-type(1) {
            background: linear-gradient(135deg, #475fff 0%, #5c92ff 100%);
            box-shadow: 0 4px 15px rgba(71, 135, 255, 0.4);
        }
        
        button:nth-of-type(1):hover {
            box-shadow: 0 6px 20px rgba(71, 154, 255, 0.6);
        }
        
        button:nth-of-type(2) {
            background: linear-gradient(135deg, #FFB347 0%, #FFCC5C 100%);
            box-shadow: 0 4px 15px rgba(255, 179, 71, 0.4);
        }
        
        button:nth-of-type(2):hover {
            box-shadow: 0 6px 20px rgba(255, 179, 71, 0.6);
        }
        
        button:nth-of-type(3) {
            background: linear-gradient(135deg, #98D8C8 0%, #6BCF9F 100%);
            box-shadow: 0 4px 15px rgba(152, 216, 200, 0.4);
        }
        
        button:nth-of-type(3):hover {
            box-shadow: 0 6px 20px rgba(152, 216, 200, 0.6);
        }
        
        button:nth-of-type(4) {
            background: linear-gradient(135deg, #A8B5E8 0%, #8B9FE8 100%);
            box-shadow: 0 4px 15px rgba(168, 181, 232, 0.4);
        }
        
        button:nth-of-type(4):hover {
            box-shadow: 0 6px 20px rgba(168, 181, 232, 0.6);
        }
        
        .difficulty-selector {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .difficulty-selector label {
            font-weight: bold;
            color: #1F4E78;
            margin-right: 10px;
        }
        
        .difficulty-selector select {
            padding: 8px 15px;
            border-radius: 8px;
            border: 2px solid #667eea;
            font-size: 16px;
            cursor: pointer;
            background-color: white;
        }
        
        .score {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #1F4E78;
        }
        
        .game-area {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .table-container {
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 10px;
            overflow: hidden;
        }
        
        th {
            background: linear-gradient(135deg, #1F4E78 0%, #2d5f8d 100%);
            color: white;
            padding: 15px 10px;
            text-align: center;
            font-weight: bold;
            border: 1px solid #1a3d5f;
            font-size: 14px;
        }
        
        td {
            padding: 12px 8px;
            border: 1px solid #999;
            background-color: #B4C6E7;
            font-size: 13px;
        }
        
        .drop-zone {
            min-height: 35px;
            background-color: #FFFF99;
            border: 2px dashed #ccc;
            border-radius: 5px;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .drop-zone.drag-over {
            background-color: #E8F5E9;
            border-color: #4CAF50;
            transform: scale(1.02);
        }
        
        .drop-zone.filled {
            background-color: #E3F2FD;
            border: 2px solid #2196F3;
        }
        
        .drop-zone.correct {
            background-color: #C8E6C9;
            border: 2px solid #4CAF50;
            animation: pulse 0.5s;
        }
        
        .drop-zone.incorrect {
            background-color: #FFCDD2;
            border: 2px solid #F44336;
            animation: shake 0.5s;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        .word-bank {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-height: 800px;
            overflow-y: auto;
            position: sticky;
            top: 20px;
            z-index: 100;
        }
        
        .word-bank h3 {
            color: #1F4E78;
            margin-bottom: 15px;
            text-align: center;
            font-size: 1.3em;
        }
        
        .draggable-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 15px;
            margin: 8px 0;
            border-radius: 8px;
            cursor: move;
            transition: all 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            font-size: 14px;
            text-align: center;
            user-select: none;
        }
        
        .draggable-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        
        .draggable-item.dragging {
            opacity: 0.5;
            cursor: grabbing;
        }
        
        .draggable-item.used {
            /* Items stay visible even when used */
        }
        
        .feedback {
            text-align: center;
            margin: 15px auto;
            padding: 20px 30px;
            border-radius: 15px;
            font-size: 22px;
            font-weight: bold;
            display: none;
            animation: slideIn 0.5s;
            max-width: 800px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .feedback.show {
            display: block;
        }
        
        .feedback.success {
            background: linear-gradient(135deg, #C8E6C9 0%, #A5D6A7 100%);
            color: #2E7D32;
        }
        
        .feedback.partial {
            background: linear-gradient(135deg, #FFF9C4 0%, #FFF59D 100%);
            color: #F57F17;
        }
        
        .feedback.error {
            background: linear-gradient(135deg, #FFCDD2 0%, #EF9A9A 100%);
            color: #C62828;
        }
        
        .chip {
            display: inline-block;
            padding: 4px 10px;
            background-color: #E3F2FD;
            border-radius: 12px;
            font-size: 12px;
            color: #1976D2;
            margin: 2px;
        }
        
        @media (max-width: 1024px) {
            .game-area {
                grid-template-columns: 1fr;
            }
            
            .word-bank {
                max-height: 400px;
            }
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            table {
                font-size: 11px;
            }
            
            th, td {
                padding: 8px 4px;
            }
            
            .draggable-item {
                font-size: 12px;
                padding: 8px 12px;
            }
        }
        
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }
        
        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 10px;

        td {
            white-space: pre-line;
        }

        .data-controls button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            padding: 8px 20px;
            font-size: 14px;
        }

        .data-controls button:hover {
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .source {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            background-color: #f5f5f5;
            border-radius: 10px;
            font-size: 14px;
            color: #666;
        }

        .designer-link {
            align-self: center;
            color: #667eea;
            font-weight: bold;
            text-decoration: none;
        }
        
        .designer-link:hover {
            text-decoration: underline;
        }
        
        body.file-drag-over .container {
            outline: 4px dashed #667eea;
            outline-offset: -10px;
        }
    </style>
</head>
<body>
    <canvas id="confetti-canvas"></canvas>
    <div class="container">
        <div class="header-container">
            <h1 id="pageTitle">Table Jigsaw</h1>
        </div>
        <div class="instructions" id="instructions"></div>

        <div class="controls data-controls">
            <button onclick="document.getElementById('fileInput').click()">📂 Load JSON</button>
            <button onclick="downloadDataset()">⬇️ Download JSON</button>
            <button onclick="useSampleData()">↩ Sample Data</button>
            <input type="file" id="fileInput" accept=".json,application/json" hidden>
        </div>
        <div class="difficulty-selector">
            <label for="difficulty">Difficulty:</label>
            <select id="difficulty" onchange="changeDifficulty()">
                <option value="easy">Easy</option>
                <option value="medium" selected>Medium</option>
                <option value="hard">Hard</option>
                <option value="expert">Expert</option>
            </select>
        </div>

        <div class="controls">
            <button class="scramble-btn" onclick="scrambleBlanks()">🔀 Scramble Blanks</button>
            <button onclick="checkAnswers()">✅ Check Answers</button>
            <button onclick="showAnswers()">💡 Show Answers</button>
            <button onclick="resetGame()">↺ Reset</button>
        </div>

        <div class="score" id="score"></div>
        <div class="feedback" id="feedback"></div>

        <div class="game-area">
            <div class="table-container">
                <table>
                    <thead id="tableHead">
                    </thead>
                    <tbody id="tableBody">
                    </tbody>
                </table>
            </div>

            <div class="word-bank">
                <h3>🧩 Answer Options</h3>
                <div id="wordBankItems"></div>
            </div>
        </div>

        <div class="source" id="source"></div>
        <div class="controls">
            <a class="designer-link" href="instructor.html">✏️ Edit in designer</a>
        </div>
    </div>

    <script src="dataset.js"></script>
    <script>
        const DEFAULT_DIFFICULTY = {
            easy: { min: 0.15, max: 0.25 },
            medium: { min: 0.30, max: 0.40 },
            hard: { min: 0.50, max: 0.60 },
            expert: { min: 0.70, max: 0.80 }
        };

        let currentDataset = null;
        let blanks = new Set();
        let currentDifficulty = 'medium';
        const answers = {};

        function getSubrows(row) {
            return row.subrows || [row];
        }

        function getCellValue(row, subIdx, col) {
            const source = col.group ? row : getSubrows(row)[subIdx];
            const value = source[col.key];
            return value === undefined || value === null ? '' : String(value);
        }

        function cellId(rowIdx, subIdx, col) {
            return col.group ? `r${rowIdx}-k:${col.key}` : `r${rowIdx}-s${subIdx}-k:${col.key}`;
        }

        function loadDataset(ds) {
            currentDataset = ds;
            const title = ds.title || 'Table Jigsaw';
            document.title = title;
            document.getElementById('pageTitle').textContent = title;
            document.getElementById('instructions').textContent =
                ds.instructions || 'Drag and drop the answer options to fill in the blanks.';

            const source = document.getElementById('source');
            source.textContent = ds.source || '';
            source.style.display = ds.source ? '' : 'none';

            const thead = document.getElementById('tableHead');
            thead.innerHTML = '';
            const tr = document.createElement('tr');
            ds.columns.forEach(col => {
                const th = document.createElement('th');
                th.textContent = col.label || col.key;
                if (col.width) th.style.width = col.width;
                tr.appendChild(th);
            });
            thead.appendChild(tr);

            scrambleBlanks();
        }

        function generateBlankPattern(difficulty) {
            const columns = currentDataset.columns;

            // Create a list of all possible blank positions (non-empty cells)
            const allPositions = [];
            currentDataset.rows.forEach((row, rowIdx) => {
                getSubrows(row).forEach((sub, subIdx) => {
                    columns.forEach(col => {
                        if (col.group && subIdx > 0) return;
                        const value = getCellValue(row, subIdx, col);
                        if (value.trim()) {
                            allPositions.push({ id: cellId(rowIdx, subIdx, col), value, reusable: !!col.reusable });
                        }
                    });
                });
            });

            const ranges = (currentDataset.difficulty && currentDataset.difficulty[difficulty]) ||
                DEFAULT_DIFFICULTY[difficulty];
            let min = ranges.min, max = ranges.max;
            // Fractional ranges are proportions of the available cells
            if (max <= 1) {
                min = Math.round(min * allPositions.length);
                max = Math.round(max * allPositions.length);
            }
            max = Math.max(1, Math.min(max, allPositions.length));
            min = Math.max(1, Math.min(min, max));
            const desiredBlankCount = Math.floor(Math.random() * (max - min + 1)) + min;

            // Shuffle positions
            allPositions.sort(() => Math.random() - 0.5);

            // Select the desired number of blanks; non-reusable values are blanked at most once
            const result = new Set();
            const usedWords = new Set();
            for (let i = 0; i < allPositions.length && result.size < desiredBlankCount; i++) {
                const pos = allPositions[i];
                if (!pos.reusable && usedWords.has(pos.value)) continue;
                result.add(pos.id);
                if (!pos.reusable) usedWords.add(pos.value);
            }

            return result;
        }

        function scrambleBlanks() {
            resetGame();
            blanks = generateBlankPattern(currentDifficulty);
            renderTable();
            renderWordBank();

            showFeedback('✨ New blanks generated! Good luck!', 'partial', 3000);
        }

        function changeDifficulty() {
            currentDifficulty = document.getElementById('difficulty').value;
            scrambleBlanks();
        }

        function showFeedback(message, kind, hideAfter) {
            const feedback = document.getElementById('feedback');
            feedback.textContent = message;
            feedback.className = `feedback show ${kind}`;
            clearTimeout(showFeedback.timer);
            if (hideAfter) {
                showFeedback.timer = setTimeout(() => feedback.classList.remove('show'), hideAfter);
            }
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            currentDataset.rows.forEach((row, rowIdx) => {
                const subrows = getSubrows(row);
                subrows.forEach((sub, subIdx) => {
                    const tr = document.createElement('tr');

                    currentDataset.columns.forEach(col => {
                        if (col.group && subIdx > 0) return;

                        const td = document.createElement('td');
                        if (col.group) td.rowSpan = subrows.length;
                        if (col.align) td.style.textAlign = col.align;

                        const id = cellId(rowIdx, subIdx, col);
                        const value = getCellValue(row, subIdx, col);
                        if (blanks.has(id)) {
                            const zone = document.createElement('div');
                            zone.className = 'drop-zone';
                            zone.dataset.dropId = id;
                            zone.dataset.answer = value;
                            td.appendChild(zone);
                        } else {
                            td.textContent = value;
                        }
                        tr.appendChild(td);
                    });

                    tbody.appendChild(tr);
                });
            });

            setupDropZones();
        }

        function renderWordBank() {
            const container = document.getElementById('wordBankItems');
            container.innerHTML = '';

            const neededItems = new Map();

            currentDataset.rows.forEach((row, rowIdx) => {
                getSubrows(row).forEach((sub, subIdx) => {
                    currentDataset.columns.forEach(col => {
                        if (col.group && subIdx > 0) return;
                        if (blanks.has(cellId(rowIdx, subIdx, col))) {
                            const value = getCellValue(row, subIdx, col);
                            neededItems.set(value, neededItems.get(value) || !!col.reusable);
                        }
                    });
                });
            });

            const itemsArray = Array.from(neededItems.keys());
            itemsArray.sort(() => Math.random() - 0.5); // Shuffle

            itemsArray.forEach((text, idx) => {
                const div = document.createElement('div');
                div.className = 'draggable-item';
                div.draggable = true;
                div.dataset.itemId = `item-${idx}`;
                div.dataset.itemText = text;
                if (neededItems.get(text)) div.dataset.reusable = 'true';
                div.textContent = text;

                div.addEventListener('dragstart', handleDragStart);
                div.addEventListener('dragend', handleDragEnd);

                container.appendChild(div);
            });
        }

        function findItemByText(text) {
            return Array.from(document.querySelectorAll('.draggable-item')).find(
                item => item.dataset.itemText === text
            );
        }

        function handleDragStart(e) {
            e.currentTarget.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', e.currentTarget.dataset.itemId);
            e.dataTransfer.setData('text', e.currentTarget.dataset.itemText);
        }

        function handleDragEnd(e) {
            e.currentTarget.classList.remove('dragging');
        }

        function setupDropZones() {
            const dropZones = document.querySelectorAll('.drop-zone');

            dropZones.forEach(zone => {
                zone.addEventListener('dragover', handleDragOver);
                zone.addEventListener('dragleave', handleDragLeave);
                zone.addEventListener('drop', handleDrop);
                zone.addEventListener('click', handleZoneClick);
            });
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.currentTarget.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.preventDefault();
            const dropZone = e.currentTarget;
            dropZone.classList.remove('drag-over');

            const itemText = e.dataTransfer.getData('text');
            const itemId = e.dataTransfer.getData('text/plain');

            if (!itemText) return;
            e.stopPropagation();

            dropZone.classList.remove('correct', 'incorrect');

            // Remove 'used' from the old item if replacing
            if (dropZone.dataset.currentItemId) {
                const oldItem = findItemByText(dropZone.dataset.currentText);
                if (oldItem) {
                    oldItem.classList.remove('used');
                }
            }

            dropZone.textContent = itemText;
            dropZone.classList.add('filled');
            dropZone.dataset.currentItemId = itemId;
            dropZone.dataset.currentText = itemText;

            // Find the dragged item by its text and mark it as used (reusable items stay available)
            const draggedItem = findItemByText(itemText);
            if (draggedItem && !draggedItem.dataset.reusable) {
                draggedItem.classList.add('used');
            }

            answers[dropZone.dataset.dropId] = itemText;
        }

        function handleZoneClick(e) {
            const dropZone = e.currentTarget;
            if (dropZone.dataset.currentText) {
                const item = findItemByText(dropZone.dataset.currentText);
                if (item) {
                    item.classList.remove('used');
                }

                dropZone.textContent = '';
                dropZone.classList.remove('filled', 'correct', 'incorrect');
                delete dropZone.dataset.currentItemId;
                delete dropZone.dataset.currentText;
                delete answers[dropZone.dataset.dropId];
            }
        }

        function checkAnswers() {
            let correct = 0;
            let total = 0;

            const dropZones = document.querySelectorAll('.drop-zone');
            dropZones.forEach(zone => {
                if (zone.dataset.answer) {
                    total++;
                    const userAnswer = zone.dataset.currentText || '';
                    const correctAnswer = zone.dataset.answer;

                    if (userAnswer.toLowerCase().trim() === correctAnswer.toLowerCase().trim()) {
                        zone.classList.add('correct');
                        zone.classList.remove('incorrect');
                        correct++;
                    } else {
                        zone.classList.add('incorrect');
                        zone.classList.remove('correct');
                    }
                }
            });

            if (total === 0) return;

            const score = document.getElementById('score');
            const percentage = Math.round((correct / total) * 100);
            score.textContent = `Score: ${correct}/${total} (${percentage}%)`;

            if (percentage === 100) {
                createConfetti();
                showFeedback('🎉 Perfect Score! You got 100% correct!', 'success');
            } else if (percentage >= 80) {
                showFeedback(`🌟 Great Job! You got ${percentage}% correct!`, 'success');
            } else if (percentage >= 60) {
                showFeedback(`👍 Good Effort! You got ${percentage}% correct. Keep practicing!`, 'partial');
            } else {
                showFeedback(`📚 Keep Studying! You got ${percentage}% correct. Review and try again!`, 'error');
            }
        }

        function showAnswers() {
            const dropZones = document.querySelectorAll('.drop-zone');
            dropZones.forEach(zone => {
                if (zone.dataset.answer) {
                    if (zone.dataset.currentText) {
                        const item = findItemByText(zone.dataset.currentText);
                        if (item) {
                            item.classList.remove('used');
                        }
                    }

                    zone.textContent = zone.dataset.answer;
                    zone.classList.add('filled', 'correct');
                    zone.classList.remove('incorrect');

                    const correctItem = findItemByText(zone.dataset.answer);
                    if (correctItem) {
                        if (!correctItem.dataset.reusable) correctItem.classList.add('used');
                        zone.dataset.currentItemId = correctItem.dataset.itemId;
                        zone.dataset.currentText = zone.dataset.answer;
                    }
                }
            });

            showFeedback('✨ All answers revealed! Study them carefully.', 'success');
        }

        function resetGame() {
            const dropZones = document.querySelectorAll('.drop-zone');
            dropZones.forEach(zone => {
                zone.textContent = '';
                zone.classList.remove('filled', 'correct', 'incorrect');
                delete zone.dataset.currentItemId;
                delete zone.dataset.currentText;
            });

            const items = document.querySelectorAll('.draggable-item');
            items.forEach(item => {
                item.classList.remove('used');
            });

            document.getElementById('score').textContent = '';
            document.getElementById('feedback').classList.remove('show');

            Object.keys(answers).forEach(key => delete answers[key]);
        }

        // Loading, saving and downloading datasets
        function saveDataset(ds) {
            try {
                if (ds) {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(ds));
                } else {
                    localStorage.removeItem(STORAGE_KEY);
                }
            } catch (e) {
                // Storage unavailable (private mode, quota); the dataset just won't persist
            }
        }

        function loadSavedDataset() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) return validateDataset(JSON.parse(saved));
            } catch (e) {
                saveDataset(null);
            }
            return null;
        }

        function loadFile(file) {
            const reader = new FileReader();
            reader.onload = () => {
                let ds;
                try {
                    ds = validateDataset(JSON.parse(reader.result));
                } catch (e) {
                    showFeedback(`⚠️ Could not load ${file.name}: ${e.message}`, 'error');
                    return;
                }
                saveDataset(ds);
                loadDataset(ds);
                showFeedback(`📂 Loaded ${file.name}`, 'success', 3000);
            };
            reader.onerror = () => showFeedback(`⚠️ Could not read ${file.name}`, 'error');
            reader.readAsText(file);
        }

        function downloadDataset() {
            downloadJSON(currentDataset, currentDataset.title);
        }

        function useSampleData() {
            saveDataset(null);
            loadDataset(SAMPLE_DATASET);
        }

        document.getElementById('fileInput').addEventListener('change', e => {
            const file = e.target.files[0];
            if (file) loadFile(file);
            e.target.value = '';
        });

        // Drag a .json file anywhere onto the page (word-bank chips are ignored)
        const isFileDrag = e => e.dataTransfer && Array.from(e.dataTransfer.types).includes('Files');
        document.addEventListener('dragover', e => {
            if (!isFileDrag(e)) return;
            e.preventDefault();
            document.body.classList.add('file-drag-over');
        });
        document.addEventListener('dragleave', e => {
            if (e.relatedTarget === null) document.body.classList.remove('file-drag-over');
        });
        document.addEventListener('drop', e => {
            if (!isFileDrag(e)) return;
            e.preventDefault();
            document.body.classList.remove('file-drag-over');
            const file = e.dataTransfer.files[0];
            if (file) loadFile(file);
        });

        // Initialize with the saved dataset, or the sample
        loadDataset(loadSavedDataset() || SAMPLE_DATASET);

        // Confetti Animation
        function createConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const confettiPieces = [];
            const confettiCount = 150;
            const colors = ['#FF6B9D', '#FFB347', '#98D8C8', '#A8B5E8', '#FFA07A', '#667eea', '#764ba2'];
            
            class Confetti {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height - canvas.height;
                    this.w = Math.random() * 10 + 5;
                    this.h = Math.random() * 5 + 5;
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                    this.speed = Math.random() * 3 + 2;
                    this.angle = Math.random() * 360;
                    this.rotationSpeed = Math.random() * 10 - 5;
                    this.opacity = 1;
                }
                
                update() {
                    this.y += this.speed;
                    this.angle += this.rotationSpeed;
                    this.x += Math.sin(this.angle * Math.PI / 180) * 2;
                    
                    if (this.y > canvas.height) {
                        this.opacity -= 0.05;
                    }
                }
                
                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.angle * Math.PI / 180);
                    ctx.globalAlpha = this.opacity;
                    ctx.fillStyle = this.color;
                    ctx.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);
                    ctx.restore();
                }
            }
            
            for (let i = 0; i < confettiCount; i++) {
                confettiPieces.push(new Confetti());
            }
            
            let animationId;
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                confettiPieces.forEach((piece, index) => {
                    piece.update();
                    piece.draw();
                    
                    if (piece.opacity <= 0) {
                        confettiPieces.splice(index, 1);
                    }
                });
                
                if (confettiPieces.length > 0) {
                    animationId = requestAnimationFrame(animate);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    cancelAnimationFrame(animationId);
                }
            }
            
            animate();
        }
        
        window.addEventListener('resize', () => {
            const canvas = document.getElementById('confetti-canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
